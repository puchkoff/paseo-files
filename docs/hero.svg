<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ff"/>
      <stop offset="0.55" stop-color="#f3f6ff"/>
      <stop offset="1" stop-color="#fff6ec"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
    <symbol id="sparkles" viewBox="0 0 24 24">
      <path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/>
      <path d="M19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9z"/>
    </symbol>
    <symbol id="cursor" viewBox="0 0 24 24">
      <path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.5-6.8L4 19.5z" fill="#111827" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="300" fill="url(#glowA)"/>
  <circle cx="880" cy="600" r="260" fill="url(#glowB)"/>
  <circle cx="90" cy="610" r="200" fill="url(#glowA)" opacity="0.6"/>
  <g transform="translate(80 150)">
    <rect x="0" y="0" width="196" height="36" rx="18" fill="#ede9fe"/>
    <use href="#sparkles" x="14" y="8" width="20" height="20" fill="#7c3aed"/>
    <text x="42" y="24" font-size="16" fill="#6d28d9" font-weight="600" text-anchor="start" >Paseo plugin</text>
    <text x="0" y="140" font-size="64" fill="url(#brand)" font-weight="800" text-anchor="start" letter-spacing="-1.5">Paste files</text>
    <text x="0" y="232" font-size="22" fill="#4338ca" font-weight="400" text-anchor="start" opacity="0.85">Any file into the composer, with Cmd+V.</text>
    <circle cx="9" cy="281" r="5" fill="#f59e0b"/><text x="26" y="288" font-size="19" fill="#3f3f6e" font-weight="400" text-anchor="start" >PDFs, logs, archives, anything</text>
    <circle cx="9" cy="319" r="5" fill="#f59e0b"/><text x="26" y="326" font-size="19" fill="#3f3f6e" font-weight="400" text-anchor="start" >Attached like drag and drop</text>
    <circle cx="9" cy="357" r="5" fill="#f59e0b"/><text x="26" y="364" font-size="19" fill="#3f3f6e" font-weight="400" text-anchor="start" >Web and desktop apps</text>
  </g>
  <g transform="translate(680 70)" filter="url(#shadow)"><rect width="520" height="508" rx="28" fill="#ffffff"/></g>
  <g transform="translate(680 70)">
    <circle cx="36" cy="38" r="6" fill="#fca5a5"/><circle cx="56" cy="38" r="6" fill="#fde68a"/><circle cx="76" cy="38" r="6" fill="#a7f3d0"/>
    <text x="260" y="44" font-size="15" fill="#6b7280" font-weight="600" text-anchor="middle" >Agent composer</text>
    <line x1="0" y1="68" x2="520" y2="68" stroke="#eef0f6"/>
    <rect x="24" y="92" width="330" height="52" rx="14" fill="#f6f7fb" stroke="#eef0f6"/><text x="40" y="118" font-size="13" fill="#374151" font-weight="400" text-anchor="start" >Can you check why the export fails?</text>
    <text x="260" y="186" font-size="13" fill="#6b7280" font-weight="600" text-anchor="middle" >copied in your file manager</text>
    <rect x="178" y="200" width="50" height="30" rx="7" fill="#fff" stroke="#c7cbe0"/><rect x="178" y="226" width="50" height="4" rx="2" fill="#e5e7f0"/><text x="203.0" y="220" font-size="14" fill="#3f3f6e" font-weight="700" text-anchor="middle" >Ctrl</text>
    <text x="236" y="220" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start" >+</text>
    <rect x="250" y="200" width="34" height="30" rx="7" fill="#fff" stroke="#c7cbe0"/><rect x="250" y="226" width="34" height="4" rx="2" fill="#e5e7f0"/><text x="267.0" y="220" font-size="14" fill="#3f3f6e" font-weight="700" text-anchor="middle" >V</text>
    <text x="296" y="220" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >or ⌘V</text>
    <rect x="24" y="262" width="472" height="150" rx="14" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="40" y="278" width="168" height="40" rx="10" fill="#fff" stroke="#e5e7f0"/><rect x="48" y="286" width="34" height="24" rx="6" fill="#ef4444"/><text x="65" y="302" font-size="10" fill="#fff" font-weight="800" text-anchor="middle" >PDF</text><text x="90" y="303" font-size="13" fill="#111827" font-weight="600" text-anchor="start" >invoice-0412.pdf</text>
    <rect x="218" y="278" width="140" height="40" rx="10" fill="#fff" stroke="#e5e7f0"/><rect x="226" y="286" width="34" height="24" rx="6" fill="#0ea5e9"/><text x="243" y="302" font-size="10" fill="#fff" font-weight="800" text-anchor="middle" >LOG</text><text x="268" y="303" font-size="13" fill="#111827" font-weight="600" text-anchor="start" >export.log</text>
    <rect x="40" y="326" width="150" height="40" rx="10" fill="#fff" stroke="#e5e7f0"/><rect x="48" y="334" width="34" height="24" rx="6" fill="#f59e0b"/><text x="65" y="350" font-size="10" fill="#fff" font-weight="800" text-anchor="middle" >ZIP</text><text x="90" y="351" font-size="13" fill="#111827" font-weight="600" text-anchor="start" >fixtures.zip</text>
    <text x="44" y="396" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Here are the files from yesterday’s run</text>
    <circle cx="468" cy="384" r="15" fill="url(#brand)"/><text x="468" y="389" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" >↑</text>
    <rect x="24" y="436" width="220" height="22" rx="11.0" fill="#dcfce7"/><text x="134.0" y="451.0" font-size="12" fill="#166534" font-weight="600" text-anchor="middle" >attached, same as drag and drop</text>
  </g>
</svg>
